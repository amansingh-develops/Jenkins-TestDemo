<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registration Form with Name, Email, Contact Number, and Submit button">
  <title>Sign In / Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <!-- Left Column: Form -->
    <div class="form-section">
      <h1 class="form-title">Signin</h1>

      <form id="registration-form" action="#" method="POST">
        <!-- Name Field -->
        <div class="input-group">
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="ByteWebster (Full Name)" 
            required 
            autocomplete="name"
          >
        </div>

        <!-- Email Field -->
        <div class="input-group">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Email Address" 
            required 
            autocomplete="email"
          >
        </div>

        <!-- Contact Number Field -->
        <div class="input-group">
          <input 
            type="tel" 
            id="contact" 
            name="contact" 
            placeholder="Contact Number" 
            required 
            autocomplete="tel"
          >
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit" class="submit-btn">Signin</button>

        <!-- Social Links -->
        <div class="social-section">
          <p class="social-text">or signin with</p>
          <div class="social-icons">
            <a href="#" class="social-icon facebook" title="Facebook">f</a>
            <a href="#" class="social-icon google" title="Google">G+</a>
            <a href="#" class="social-icon linkedin" title="LinkedIn">in</a>
          </div>
        </div>
      </form>
    </div>

    <!-- Right Column: Welcome Banner -->
    <div class="welcome-section">
      <div class="welcome-content">
        <h2 class="welcome-title">Welcome back!</h2>
        <p class="welcome-text">
          Welcome back! We are so happy to have you here. It's great to see you again. We hope you had a safe and enjoyable time away.
        </p>
        <button type="button" class="signup-pill-btn">No account yet? Signup.</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
